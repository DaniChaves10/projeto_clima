<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Previsão do Tempo</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="day-theme">
  <main class="container">
    <h1 class="title">Previsão do Tempo</h1>

    <form id="search-form" class="search" autocomplete="off">
      <input
        type="text"
        id="city-input"
        class="search__input"
        placeholder="Digite o nome da cidade"
        aria-label="Nome da cidade"
      />
      <button type="submit" id="search-button" class="search__button">Buscar</button>
    </form>

    <p id="error-message" class="error" role="alert" hidden></p>
    <p id="loading" class="loading" hidden>Carregando...</p>

    <section id="weather-card" class="card" hidden>
      <p id="current-date" class="card__date"></p>

      <div class="card__location">
        <h2 id="city-name" class="card__city"></h2>
        <span id="country-name" class="card__country"></span>
      </div>

      <div class="card__main">
        <i id="weather-icon" class="wi wi-day-sunny card__icon" aria-hidden="true"></i>
        <p id="temperature" class="card__temperature"></p>
      </div>

      <p id="description" class="card__description"></p>

      <ul class="details">
        <li class="details__item">
          <i class="wi wi-humidity details__icon" aria-hidden="true"></i>
          <span class="details__label">Umidade</span>
          <span id="humidity" class="details__value"></span>
        </li>
        <li class="details__item">
          <i class="wi wi-strong-wind details__icon" aria-hidden="true"></i>
          <span class="details__label">Vento</span>
          <span id="wind" class="details__value"></span>
        </li>
        <li class="details__item">
          <i class="wi wi-thermometer details__icon" aria-hidden="true"></i>
          <span class="details__label">Sensação</span>
          <span id="feels-like" class="details__value"></span>
        </li>
      </ul>
    </section>
  </main>

  <script src="api.js"></script>
</body>
</html>
